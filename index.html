<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scattergories - Pro-Gamer</title>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --gold: #c8a000;
      --gold-light: #f0c820;
      --dark: #0a0a0a;
      --card-bg: rgba(10,10,10,0.72);
      --overlay: rgba(0,0,0,0.62);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "DM Sans", "Segoe UI", Tahoma, sans-serif;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.5rem 1rem;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ===== BACKGROUND VIDEO ===== */
    #bg-video {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: -2;
      filter: saturate(1.2) contrast(1.05) brightness(0.75);
    }

    /* fallback gradient if video fails */
    #bg-fallback {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at top left, #1a1a2e, #0a0a0a 60%);
      z-index: -3;
    }

    /* dark cinematic overlay */
    #bg-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: var(--overlay);
      z-index: -1;
      /* vignette effect */
      box-shadow: inset 0 0 120px rgba(0,0,0,0.7);
    }

    /* ===== TITLE ===== */
    .game-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.5rem, 10vw, 6rem);
      letter-spacing: 0.05em;
      line-height: 1;
      text-shadow: 0 4px 30px rgba(200,160,0,0.4);
    }

    .game-title span { color: var(--gold); }

    .tagline {
      font-size: 0.95rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      margin-top: 0.3rem;
    }

    /* ===== SCREENS ===== */
    #start-screen,
    #time-up-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      min-height: 85vh;
      text-align: center;
    }

    /* level buttons */
    .level-buttons {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 0.5rem;
    }

    .start-btn {
      background: transparent;
      color: #fff;
      border: 2px solid rgba(255,255,255,0.3);
      padding: 0.9rem 2.4rem;
      font-family: 'Bebas Neue';
      font-size: 1.6rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
      background: rgba(255,255,255,0.06);
    }

    .start-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(200,160,0,0.1);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(200,160,0,0.2);
    }

    .start-btn.pro {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(200,160,0,0.12);
    }

    .start-btn.pro:hover {
      background: rgba(200,160,0,0.25);
      box-shadow: 0 8px 32px rgba(200,160,0,0.35);
    }

    /* ===== PLAY SCREEN ===== */
    #play-screen {
      display: none;
      width: 100%;
      max-width: 1100px;
      padding-top: 0.5rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(200,160,0,0.25);
    }

    .letter-badge {
      font-family: 'Bebas Neue';
      font-size: clamp(3.5rem, 10vw, 5.5rem);
      color: var(--gold);
      text-shadow: 0 0 40px rgba(200,160,0,0.5);
      line-height: 1;
    }

    .timer-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    #timer {
      font-family: 'Bebas Neue';
      font-size: clamp(3.5rem, 10vw, 5.5rem);
      line-height: 1;
      transition: color 0.3s;
    }

    #timer.warning { color: #ff6b35; text-shadow: 0 0 20px rgba(255,107,53,0.5); }
    #timer.danger  { color: #ff2244; text-shadow: 0 0 20px rgba(255,34,68,0.6); animation: pulse 0.5s infinite alternate; }

    @keyframes pulse { from { opacity: 1; } to { opacity: 0.5; } }

    .timer-label {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }

    /* ===== CATEGORY GRID ===== */
    .categories-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    @media (max-width: 700px) {
      .categories-grid { grid-template-columns: 1fr; }
    }

    .cat-card {
      border: 1px solid rgba(255,255,255,0.1);
      padding: 0.85rem 1rem;
      border-radius: 8px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      transition: border-color 0.2s, background 0.2s;
    }

    .cat-card:hover {
      border-color: rgba(200,160,0,0.4);
      background: rgba(20,20,20,0.85);
    }

    .cat-num {
      color: var(--gold);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 20px;
      margin-top: 1px;
    }

    .cat-card span:last-child { font-size: 0.92rem; line-height: 1.4; }
    .cat-card b { color: var(--gold-light); }

    /* ===== BOTTOM BAR ===== */
    .bottom-bar {
      margin-top: 1rem;
      display: flex;
      gap: 10px;
    }

    .action-btn {
      flex: 1;
      padding: 0.85rem;
      font-family: 'Bebas Neue';
      font-size: 1.3rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      border-radius: 6px;
      border: none;
      transition: all 0.2s;
    }

    .action-btn.secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .action-btn.secondary:hover { background: rgba(255,255,255,0.18); }

    .action-btn.primary {
      background: var(--gold);
      color: #000;
    }

    .action-btn.primary:hover {
      background: var(--gold-light);
      box-shadow: 0 4px 20px rgba(200,160,0,0.4);
    }

    /* ===== TIME UP ===== */
    #time-up-screen .game-title { color: #ff2244; text-shadow: 0 0 40px rgba(255,34,68,0.5); }
    #time-up-screen .game-title span { color: #ff6b35; }

    /* ===== LEVEL BADGE ===== */
    .level-badge {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-bottom: 0.3rem;
    }
  </style>
</head>

<body>

<!-- BACKGROUND LAYERS -->
<div id="bg-fallback"></div>

<!--
  🎥 BACKGROUND VIDEO
  Using a free Pexels CC0 video — cinematic city/urban timelapse feel.
  You can swap the src to any .mp4 URL or a local file path.
  Multiple <source> tags = fallback chain.
-->
<video autoplay muted loop playsinline id="bg-video" onerror="this.style.display='none'">
  <!--
    🎮 GAMING-THEMED BACKGROUND VIDEOS — all free, no watermark (Mixkit CDN)
    The browser tries each <source> in order and uses the first one that loads.

    🔥 OPTION 1 (ACTIVE): Burning lava / fire particles — intense & gamer-core
    🌌 OPTION 2: Floating particles at night — moody dark space feel
    ⚡ OPTION 3: Luminous particles on black — clean sci-fi energy
    💥 OPTION 4: Particle explosion, smoke and fire — cinematic action
    🟣 OPTION 5: Particles and purple light — neon arcade vibes

    To switch, move your preferred <source> to the TOP of the list.
  -->

  <!-- ⚡ Luminous particles on black -->
  <source src="https://assets.mixkit.co/videos/18142/18142-720.mp4" type="video/mp4">

  <!-- 🌌 Floating particles at night -->
  <source src="https://assets.mixkit.co/videos/47356/47356-720.mp4" type="video/mp4">

  <!-- 🔥 ACTIVE: Burning lava particles -->
  <source src="https://assets.mixkit.co/videos/4426/4426-720.mp4" type="video/mp4">

  

  

  

  <!-- 🟣 Particles and purple light -->
  <source src="https://assets.mixkit.co/videos/18059/18059-720.mp4" type="video/mp4">
</video>

<div id="bg-overlay"></div>

<!-- ===== START SCREEN ===== -->
<div id="start-screen">
  <div class="game-title">SCATTER<span>GORIES</span></div>
  <p class="tagline">Think fast. Start with the letter.</p>
  <div class="level-buttons">
    <button class="start-btn" onclick="startGame('beginner')">Beginner</button>
    <button class="start-btn pro" onclick="startGame('pro')">⚡ Pro Gamer</button>
  </div>
</div>

<!-- ===== GAME SCREEN ===== -->
<div id="play-screen">
  <div class="top-bar">
    <div>
      <div class="level-badge" id="level-badge">Beginner</div>
      <div class="letter-badge" id="letter-display">A</div>
    </div>
    <div class="timer-wrap">
      <div class="timer-label">Time Left</div>
      <div id="timer">60</div>
    </div>
  </div>

  <div id="categories" class="categories-grid"></div>

  <div class="bottom-bar">
    <button class="action-btn secondary" onclick="startGame()">↺ New Round</button>
    <button class="action-btn primary" onclick="stopTimer()">Stop</button>
  </div>
</div>

<!-- ===== TIME UP SCREEN ===== -->
<div id="time-up-screen" style="display:none;">
  <div class="game-title">TIME<span>UP!</span></div>
  <button class="start-btn pro" onclick="startGame()">Next Round →</button>
  <button class="start-btn" onclick="goHome()">↩ Home</button>
</div>

<script>
const QUESTION_BANK = {
  beginner: [
    "A fruit","An animal","A cartoon character","A color",
    "A toy","A snack","A drink","A superhero",
    "A game","Something in a classroom","Something you wear",
    "A body part","A vegetable","A bird","A movie",
    "Something cold","Something hot","A country","A city",
    "A holiday","A job","A sport","A musical instrument",
    "Something funny","Something scary"
  ],
  pro: [
    "A country","A capital city","A global company","A startup",
    "A movie","A Netflix show","A song","A music artist",
    "A book","An author","A historical event","A scientist",
    "A car brand","A luxury brand","A phone brand",
    "A politician","A business term","A sport",
    "A sports team","A famous person","A tourist destination",
    "A tech company","A social media platform",
    "Something expensive","Something embarrassing",
    "Something addictive","Something powerful","Something rare"
  ]
};

let currentLevel = "beginner";
let lastLetter = null;
let lastQuestions = [];
let timerInterval;

function getRandomLetter() {
  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');
  let letter;
  do { letter = letters[Math.floor(Math.random() * letters.length)]; }
  while (letter === lastLetter);
  lastLetter = letter;
  return letter;
}

function getRandomQuestions(pool, count = 10) {
  let selected;
  do { selected = [...pool].sort(() => 0.5 - Math.random()).slice(0, count); }
  while (JSON.stringify(selected) === JSON.stringify(lastQuestions));
  lastQuestions = selected;
  return selected;
}

function startGame(level = currentLevel) {
  currentLevel = level;

  const letter   = getRandomLetter();
  const questions = getRandomQuestions(QUESTION_BANK[currentLevel]);

  document.getElementById("start-screen").style.display  = "none";
  document.getElementById("time-up-screen").style.display = "none";
  document.getElementById("play-screen").style.display   = "block";

  document.getElementById("letter-display").textContent  = letter;
  document.getElementById("level-badge").textContent     = level === "pro" ? "⚡ Pro Gamer" : "Beginner";

  const grid = document.getElementById("categories");
  grid.innerHTML = "";
  questions.forEach((q, i) => {
    grid.innerHTML += `
      <div class="cat-card">
        <span class="cat-num">${i + 1}</span>
        <span>${q} starting with <b>${letter}</b></span>
      </div>`;
  });

  let time = 60;
  const timerEl = document.getElementById("timer");
  timerEl.textContent = time;
  timerEl.className = "";

  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    time--;
    timerEl.textContent = time;
    if (time <= 10) timerEl.className = "danger";
    else if (time <= 20) timerEl.className = "warning";

    if (time <= 0) { clearInterval(timerInterval); endRound(); }
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
  endRound();
}

function endRound() {
  document.getElementById("play-screen").style.display    = "none";
  document.getElementById("time-up-screen").style.display = "flex";
}

function goHome() {
  clearInterval(timerInterval);
  document.getElementById("time-up-screen").style.display = "none";
  document.getElementById("play-screen").style.display    = "none";
  document.getElementById("start-screen").style.display   = "flex";
}
</script>

</body>
</html>
